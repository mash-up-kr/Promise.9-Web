# 홈 화면 E2E (네이티브 iOS/Android 공통)
# RN 의 <Text> 는 네이티브에서도 동일하게 렌더되므로 웹 E2E 와 같은 문구를 검증한다.
appId: com.mashup.promise9
---
- launchApp
# iOS 는 섹션 헤더 Pressable 라벨("최근 저장 전체 보기")이 자식 텍스트를 흡수하므로
# 접두 정규식으로 양 플랫폼을 매칭한다 (Maestro 는 전체 일치 정규식).
# dev client 재시작 후 번들 로드가 Android 에뮬레이터에서 20초를 넘겨,
# 기본 assert 대기로는 홈 렌더 전에 실패한다 → 명시적 대기.
# (호스트 부하에 따라 60초도 넘긴 실측이 있어 120초로 여유를 둔다.)
- extendedWaitUntil:
    visible: "최근 저장.*"
    timeout: 120000
