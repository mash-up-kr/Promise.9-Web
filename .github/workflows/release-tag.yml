name: Release Tag

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 앱+웹 태그·릴리즈
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT=$(node scripts/release-tag.js app.json v)
          if [ -z "$OUT" ]; then echo "앱 버전이 그대로다 — 건너뜀"; exit 0; fi
          TAG=$(printf '%s\n' "$OUT" | sed -n 1p)
          PREV=$(printf '%s\n' "$OUT" | sed -n 2p)
          git tag "$TAG"
          git push origin "$TAG"
          if [ -n "$PREV" ]; then
            gh release create "$TAG" --title "$TAG" --generate-notes --notes-start-tag "$PREV"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

      - name: 익스텐션 태그·릴리즈
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT=$(node scripts/release-tag.js extension/package.json ext-v)
          if [ -z "$OUT" ]; then echo "익스텐션 버전이 그대로다 — 건너뜀"; exit 0; fi
          TAG=$(printf '%s\n' "$OUT" | sed -n 1p)
          PREV=$(printf '%s\n' "$OUT" | sed -n 2p)
          git tag "$TAG"
          git push origin "$TAG"
          if [ -n "$PREV" ]; then
            gh release create "$TAG" --title "$TAG" --generate-notes --notes-start-tag "$PREV"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  sync-dev:
    # main 에만 있는 커밋을 dev 로 되돌린다. 이 백머지를 빠뜨리면 다음 릴리즈에 같은 버그가 재발한다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 동기화 PR 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin dev main
          if [ -z "$(git log origin/dev..origin/main --oneline)" ]; then
            echo "dev 가 main 을 이미 포함한다 — 동기화 불필요"
            exit 0
          fi
          git push -f origin origin/main:refs/heads/chore/sync-main-to-dev
          # 열린 PR 이 있는지 먼저 확인한다 — gh pr create 실패를 통째로 삼키면
          # 권한 미설정 같은 진짜 실패가 "이미 있음"으로 위장돼 백머지 감시가 무력해진다.
          OPEN=$(gh pr list --head chore/sync-main-to-dev --base dev --state open --json number -q '.[].number')
          if [ -n "$OPEN" ]; then
            echo "이미 열린 동기화 PR 이 있습니다 (#$OPEN)"
            exit 0
          fi
          gh pr create --base dev --head chore/sync-main-to-dev \
            --title "chore: main 을 dev 로 동기화" \
            --body "릴리즈·핫픽스로 main 에만 들어간 커밋을 dev 에 반영합니다."
