name: Release Tag

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 앱+웹 태그·릴리즈
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT=$(node scripts/release-tag.js app.json v)
          if [ -z "$OUT" ]; then echo "앱 버전이 그대로다 — 건너뜀"; exit 0; fi
          TAG=$(printf '%s\n' "$OUT" | sed -n 1p)
          PREV=$(printf '%s\n' "$OUT" | sed -n 2p)
          git tag "$TAG"
          git push origin "$TAG"
          if [ -n "$PREV" ]; then
            gh release create "$TAG" --title "$TAG" --generate-notes --notes-start-tag "$PREV"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

      - name: 익스텐션 태그·릴리즈
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT=$(node scripts/release-tag.js extension/package.json ext-v)
          if [ -z "$OUT" ]; then echo "익스텐션 버전이 그대로다 — 건너뜀"; exit 0; fi
          TAG=$(printf '%s\n' "$OUT" | sed -n 1p)
          PREV=$(printf '%s\n' "$OUT" | sed -n 2p)
          git tag "$TAG"
          git push origin "$TAG"
          if [ -n "$PREV" ]; then
            gh release create "$TAG" --title "$TAG" --generate-notes --notes-start-tag "$PREV"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  sync-dev:
    # main 에만 있는 커밋을 dev 로 되돌린다. 이 백머지를 빠뜨리면 다음 릴리즈에 같은 버그가 재발한다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 동기화 PR 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin dev main
          AHEAD=$(git log origin/dev..origin/main --oneline)
          if [ -z "$AHEAD" ]; then
            echo "dev 가 main 을 이미 포함한다 — 동기화 불필요"
            exit 0
          fi
          # 열린 PR 이 있으면 push 하지 않는다 — gh pr create 실패를 통째로 삼키지 않기 위함이자,
          # 인간이 sync 브랜치에서 푼 conflict 해결 커밋을 force-push 로 덮어쓰지 않기 위함이다.
          OPEN=$(gh pr list --head chore/sync-main-to-dev --base dev --state open --json number -q '.[].number')
          if [ -n "$OPEN" ]; then
            echo "이미 열린 동기화 PR 이 있습니다 (#$OPEN) — 브랜치를 건드리지 않는다"
            exit 0
          fi
          git push -f origin origin/main:refs/heads/chore/sync-main-to-dev
          gh pr create --base dev --head chore/sync-main-to-dev \
            --title "chore: main 을 dev 로 동기화" \
            --body "릴리즈·핫픽스로 main 에만 들어간 커밋을 dev 에 반영합니다.

          **이 PR 은 반드시 \"Create a merge commit\" 으로 머지하세요.** squash 로 머지하면 main 의 커밋이 dev 에서 도달 불가라, 동기화 감지기가 이후 모든 main push 에서 계속 오탐합니다."
